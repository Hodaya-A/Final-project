<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background-color: #ffffff; border-radius: 12px;">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:0.0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6c5ce7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <text x="400" y="45" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3436" text-anchor="middle">מגמת העלייה בבזבוז המזון (מיליוני טונות)</text>

  <g stroke="#f1f2f6" stroke-width="1.5">
    <line x1="60" y1="350" x2="740" y2="350" />
    <line x1="60" y1="280" x2="740" y2="280" />
    <line x1="60" y1="210" x2="740" y2="210" />
    <line x1="60" y1="140" x2="740" y2="140" />
  </g>

  <g font-family="Heebo, Arial, sans-serif" font-size="13" fill="#b2bec3" text-anchor="end">
    <text x="50" y="355">2.2</text>
    <text x="50" y="285">2.4</text>
    <text x="50" y="215">2.6</text>
    <text x="50" y="145">2.8</text>
  </g>

  <g font-family="Heebo, Arial, sans-serif" font-size="13" font-weight="500" fill="#636e72" text-anchor="middle">
    <text x="100" y="385">2019</text>
    <text x="220" y="385">2020</text>
    <text x="340" y="385">2021</text>
    <text x="460" y="385">2022</text>
    <text x="580" y="385">2024</text>
    <text x="700" y="385">2025</text>
  </g>

  <path d="M100,320 L220,300 L340,260 L460,230 L580,200 L700,160 L700,350 L100,350 Z" fill="url(#brandGradient)" />

  <path d="M100,320 L220,300 L340,260 L460,230 L580,200 L700,160" fill="none" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <g fill="#ffffff" stroke="#6c5ce7" stroke-width="2.5">
    <circle cx="100" cy="320" r="5" />
    <circle cx="220" cy="300" r="5" />
    <circle cx="340" cy="260" r="5" />
    <circle cx="460" cy="230" r="5" />
    <circle cx="580" cy="200" r="5" />
    <circle cx="700" cy="160" r="7" stroke-width="3" />
  </g>
  
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#6c5ce7" />
    <path d="M80,40 L90,50 L70,50 Z" fill="#6c5ce7" transform="translate(0,-5)" />
    
    <text x="80" y="26" font-family="Heebo, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">צפי 2025: 2.8M</text>
  </g>

</svg>